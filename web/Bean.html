<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bean — inbox triage</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Bean — inbox triage" />
<meta property="og:description" content="Bean reads your support mail and drafts replies for you to approve. You stay in control — Bean never sends." />
<!-- Relative, and no og:url: this file is plain HTML with no server templating, so it cannot know
     the origin it is being served from. It used to hardcode one deployment's hostname, which meant
     every fork advertised — and pulled its preview image from — an instance it does not own. The
     server-rendered copy of these tags (bean/server.py _BRAND_HEAD) upgrades og:image to absolute
     and adds og:url when BEAN_PUBLIC_URL is set; keep the two in sync. -->
<meta property="og:image" content="/og-bean.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #F4EEE1;
    --cream-2: #FBF7EE;
    --paper: #FFFDF8;
    --ink: #2C2620;
    --ink-soft: #6E6457;
    --ink-faint: #9A8F7E;
    --line: #E7DECE;
    --line-soft: #EFE8DA;
    --bean: #6E4327;
    --amber: #D39A2C;
    --amber-ink: #3A2708;
    /* Bean's own face, and the one prose is read in (the open email and its draft). */
    --mono: 'Courier Prime', 'Courier New', monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --shadow: 0 1px 2px rgba(58,48,32,.04), 0 6px 18px rgba(58,48,32,.06);
    --shadow-lg: 0 2px 4px rgba(58,48,32,.05), 0 14px 40px rgba(58,48,32,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .wordmark, .bean-says-title, .why-label, .greet-text h1 { font-family: 'Courier Prime', 'Courier New', monospace; }
  button { font-family: inherit; }
  ::selection { background: #e7d9c2; }

  .pixel-bean { image-rendering: pixelated; flex: none; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .bean-bob { animation: bob 2.6s ease-in-out infinite; }

  /* The Beanary — the mark, pressable. A bare button wrapper: no chrome, no hover fill, nothing to
     suggest a control, because the point is that it looks exactly like the mark did before. The
     only affordances are the cursor and a focus ring for keyboard reach. */
  .beanary-btn {
    display: inline-flex; padding: 0; margin: 0; border: none; background: none;
    cursor: pointer; line-height: 0; border-radius: 999px; flex: none;
  }
  .beanary-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px #e7d9c2; }

  /* ---------- Bean roast (thinking mark) ----------
     mode-brew (default, ~6s) is the full journey: bean → roast → grind → pour-over → cup.
     mode-roast (2.4s) is the compact bean-only loop for 20–28px inline slots.
     Palette is variables, so tone-light swaps every colour without duplicating a keyframe. */

  .bean-roast {
    display: block; flex: none; overflow: visible;
    --r1: #C9BE9A;  /* raw / green */
    --r2: #B98A53;  /* drying */
    --r3: #8E5A32;  /* first crack */
    --r4: #6E4327;  /* --bean, resting colour */
    --r5: #4A2A18;  /* dark roast */
    --coffee: #3A2012;
    --cup: #D8B48C;
    --water: #C7BCA8;
    --heat-1: #E0A92E;
    --heat-2: #E8A87C;
  }
  /* On the ink-coloured toast the paper palette disappears; this lifts the whole ramp. */
  .bean-roast.tone-light {
    --r1: #F0E6C8; --r2: #E2BE8A; --r3: #D8A46E; --r4: #D8B48C; --r5: #B9895F;
    --coffee: #A8703F; --cup: #EFE0C6; --water: #9A8F7E;
  }

  .bean-roast .br-h1 { stop-color: var(--heat-1); }
  .bean-roast .br-h2 { stop-color: var(--heat-2); }
  .bean-roast .br-fl-o { fill: var(--heat-1); opacity: .92; }
  .bean-roast .br-fl-i { fill: #F5DEA6; opacity: .9; }

  .bean-roast .br-body { fill: var(--r4); }
  .bean-roast .br-sheen { fill: #ffffff; opacity: .20; }
  .bean-roast .br-specks circle { fill: var(--r5); }
  .bean-roast .br-bed { fill: var(--r5); }
  .bean-roast .br-dripper path { fill: none; stroke: var(--r4); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .bean-roast .br-stream { fill: var(--water); }
  .bean-roast .br-cup-body { fill: var(--cup); }
  .bean-roast .br-cup-handle { fill: none; stroke: var(--cup); stroke-width: 7; stroke-linecap: round; }
  .bean-roast .br-brew { fill: var(--coffee); }
  .bean-roast .br-steam path { fill: none; stroke: var(--water); stroke-width: 5; stroke-linecap: round; }

  .bean-roast .br-swell,
  .bean-roast .br-judder,
  .bean-roast .br-sheen,
  .bean-roast .br-heat,
  .bean-roast .br-specks,
  .bean-roast .br-bed,
  .bean-roast .br-dripper,
  .bean-roast .br-cup,
  .bean-roast .br-steam { transform-box: fill-box; transform-origin: center; }
  .bean-roast .br-bed { transform-origin: bottom; }
  .bean-roast .br-stream { transform-box: fill-box; transform-origin: top; }
  .bean-roast .br-brew { transform-box: fill-box; transform-origin: bottom; }
  .bean-roast .br-flicker { transform-box: fill-box; transform-origin: bottom; }

  .bean-roast .br-heat,
  .bean-roast .br-specks,
  .bean-roast .br-bed,
  .bean-roast .br-dripper,
  .bean-roast .br-stream,
  .bean-roast .br-cup,
  .bean-roast .br-steam { opacity: 0; }

  /* ---- compact loop: the bean roasts, nothing else ---- */
  .bean-roast.mode-roast { --roast-dur: 2.4s; }
  .bean-roast.mode-roast.is-on .br-body  { animation: bean-roast-fill  var(--roast-dur, 2.4s) ease-in-out infinite; }
  .bean-roast.mode-roast.is-on .br-swell { animation: bean-roast-swell var(--roast-dur, 2.4s) ease-in-out infinite; }
  .bean-roast.mode-roast.is-on .br-sheen { animation: bean-roast-sheen var(--roast-dur, 2.4s) ease-in-out infinite; }
  .bean-roast.mode-roast.is-on .br-heat  { animation: bean-roast-heat  var(--roast-dur, 2.4s) ease-in-out infinite; }

  /* Starts and ends at the RESTING colour, and only ever gets darker in between.
     It used to open on raw grey (--r1) because the story is raw → roasted. At 64px across six
     seconds that reads as a journey; at 20–28px across two it reads as the bean grEYING OUT —
     a dark mark suddenly going pale is the universal look of "disabled", so pressing Bean seemed
     to break him. The raw→cup narrative belongs to mode-brew, which has the room to tell it. */
  @keyframes bean-roast-fill {
    0%   { fill: var(--r4); }
    30%  { fill: var(--r3); }
    62%, 78% { fill: var(--r5); }
    100% { fill: var(--r4); }
  }
  /* A breath, not a disappearance. The old 93% keyframe dipped to .55 opacity — the "bean drops
     out, fresh bean drops in" beat, which only made sense while the loop restarted from raw. With
     the loop now returning to its resting colour there is nothing to swap out, so that dip was
     just a flicker at the end of every cycle. */
  @keyframes bean-roast-swell {
    0%, 100% { transform: scale(1); opacity: 1; }
    44% { transform: scale(1.04); opacity: 1; }
    72% { transform: scale(.99); opacity: 1; }
  }
  @keyframes bean-roast-sheen {
    0%   { opacity: .11; transform: scale(1.22); }
    44%  { opacity: .20; transform: scale(1); }
    82%  { opacity: .62; transform: scale(.52); }
    93%  { opacity: .30; transform: scale(.70); }
    100% { opacity: .11; transform: scale(1.22); }
  }
  @keyframes bean-roast-heat {
    0%   { opacity: 0;   transform: scale(.62); }
    30%  { opacity: .34; transform: scale(.86); }
    58%  { opacity: .72; transform: scale(1.04); }
    82%  { opacity: .88; transform: scale(1.12); }
    93%  { opacity: .16; transform: scale(.92); }
    100% { opacity: 0;   transform: scale(.62); }
  }

  /* ---- the journey: one loop = one cup ----
     0–12 raw · 12–34 roast · 34–42 grind · 40–52 bed + dripper · 52–72 pour
     72–80 handoff · 76–92 cup fills · 86–98 steam · 94–100 fresh bean */
  .bean-roast.mode-brew { --roast-dur: 6s; }
  .bean-roast.mode-brew.is-on .br-body    { animation: bean-brew-fill    var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-swell   { animation: bean-brew-bean    var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-judder  { animation: bean-brew-judder  var(--roast-dur, 6s) linear infinite; }
  .bean-roast.mode-brew.is-on .br-sheen   { animation: bean-brew-sheen   var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-heat    { animation: bean-brew-heat    var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-specks  { animation: bean-brew-specks  var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-bed     { animation: bean-brew-bed     var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-dripper { animation: bean-brew-dripper var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-stream  { animation: bean-brew-stream  var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-cup     { animation: bean-brew-cup     var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-brew    { animation: bean-brew-fill-up var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-steam   { animation: bean-brew-steam   var(--roast-dur, 6s) ease-in-out infinite; }
  .bean-roast.mode-brew.is-on .br-flicker { animation: bean-roast-flicker .42s ease-in-out infinite; }

  @keyframes bean-brew-fill {
    0%, 12% { fill: var(--r1); }
    18% { fill: var(--r2); }
    25% { fill: var(--r3); }
    30% { fill: var(--r4); }
    36%, 96% { fill: var(--r5); }
    100% { fill: var(--r1); }
  }
  @keyframes bean-brew-bean {
    0%   { opacity: 1; transform: scale(1); }
    32%  { opacity: 1; transform: scale(1.03); }
    37%  { opacity: 1; transform: scale(1); }
    42%  { opacity: 0; transform: scale(.5); }
    93%  { opacity: 0; transform: scale(.8); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* The grinder judder — the only hard, mechanical motion in the loop, so the break reads as
     something done TO the bean rather than the bean politely shrinking. */
  @keyframes bean-brew-judder {
    0%, 33%, 41%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(-5deg); }
    37% { transform: rotate(5deg); }
    39% { transform: rotate(-3deg); }
  }
  @keyframes bean-brew-sheen {
    0%   { opacity: .11; transform: scale(1.22); }
    25%  { opacity: .20; transform: scale(1); }
    36%  { opacity: .62; transform: scale(.52); }
    42%, 96% { opacity: 0; transform: scale(.5); }
    100% { opacity: .11; transform: scale(1.22); }
  }
  @keyframes bean-brew-heat {
    0%   { opacity: 0;   transform: scale(.62); }
    18%  { opacity: .34; transform: scale(.88); }
    30%  { opacity: .74; transform: scale(1.08); }
    36%  { opacity: .88; transform: scale(1.12); }
    46%, 100% { opacity: 0; transform: scale(.7); }
  }
  @keyframes bean-brew-specks {
    0%, 34% { opacity: 0; transform: translateY(-4px) scale(.6); }
    38% { opacity: 1; transform: translateY(0) scale(1); }
    48% { opacity: 1; transform: translateY(18px) scale(.7); }
    52%, 100% { opacity: 0; transform: translateY(24px) scale(.6); }
  }
  @keyframes bean-brew-bed {
    0%, 38% { opacity: 0; transform: scaleY(.15); fill: var(--r5); }
    50% { opacity: 1; transform: scaleY(1); fill: var(--r5); }
    70% { opacity: 1; transform: scaleY(1); fill: var(--coffee); }
    76% { opacity: 0; transform: scaleY(.9); fill: var(--coffee); }
    100% { opacity: 0; transform: scaleY(.15); fill: var(--r5); }
  }
  @keyframes bean-brew-dripper {
    0%, 40% { opacity: 0; transform: scale(.86); }
    50%, 72% { opacity: 1; transform: scale(1); }
    78%, 100% { opacity: 0; transform: scale(.92); }
  }
  @keyframes bean-brew-stream {
    0%, 52% { opacity: 0; transform: scaleY(0); }
    58%, 68% { opacity: 1; transform: scaleY(1); }
    73%, 100% { opacity: 0; transform: scaleY(0); }
  }
  @keyframes bean-brew-cup {
    0%, 72% { opacity: 0; transform: scale(.86); }
    80%, 92% { opacity: 1; transform: scale(1); }
    99%, 100% { opacity: 0; transform: scale(.94); }
  }
  @keyframes bean-brew-fill-up {
    0%, 76% { transform: scaleY(0); }
    92%, 100% { transform: scaleY(1); }
  }
  @keyframes bean-brew-steam {
    0%, 84% { opacity: 0; transform: translateY(4px); }
    90% { opacity: .85; transform: translateY(-3px); }
    98%, 100% { opacity: 0; transform: translateY(-11px); }
  }

  @keyframes bean-roast-flicker {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    50%      { transform: scaleY(1.13) scaleX(.94); }
  }

  /* Reduced motion: a held mid-roast bean (first crack) with a slow low-opacity cross-fade on the
     heat only. No roast curve, no grind, no pour — the journey is motion, so it is the thing that
     gets dropped. `.is-static` is the same rendering, forced, for the demo page. */
  @keyframes bean-roast-hold { 0%, 100% { opacity: .14; } 50% { opacity: .32; } }

  /* `!important` on every animation declaration below, and it is load-bearing rather than lazy.
     The running rules are `.bean-roast.mode-brew.is-on .br-body` — FOUR classes. A cancelling rule
     of `.bean-roast.is-static .br-body` is three, and the reduced-motion one is two, so both lost
     the cascade and the journey kept playing. That is invisible in the static case (the brewkit is
     hidden and `bean-brew-bean` holds opacity 0 for 42–93% of the loop, so the mark simply vanishes)
     and it is an accessibility failure in the media-query case: a reader who asked for no motion got
     the full six seconds of it. Specificity is the wrong lever for an override of last resort. */
  .bean-roast.is-static .br-body,
  .bean-roast.is-static .br-swell,
  .bean-roast.is-static .br-judder,
  .bean-roast.is-static .br-sheen,
  .bean-roast.is-static .br-flicker,
  .bean-roast.is-static .br-brewkit *,
  .bean-roast.is-static.bean-bob { animation: none !important; }
  .bean-roast.is-static .br-brewkit { display: none; }
  .bean-roast.is-static .br-body  { fill: var(--r3); }
  .bean-roast.is-static .br-swell { transform: scale(1); opacity: 1; }
  .bean-roast.is-static .br-sheen { opacity: .34; transform: scale(.78); }
  .bean-roast.is-static .br-heat  { animation: bean-roast-hold 2.4s ease-in-out infinite !important; transform: scale(1); opacity: .22; }

  @media (prefers-reduced-motion: reduce) {
    .bean-roast .br-body,
    .bean-roast .br-swell,
    .bean-roast .br-judder,
    .bean-roast .br-sheen,
    .bean-roast .br-flicker,
    .bean-roast .br-brewkit *,
    .bean-roast.bean-bob { animation: none !important; }
    .bean-roast.is-on .br-brewkit { display: none; }
    .bean-roast.is-on .br-body  { fill: var(--r3); }
    .bean-roast.is-on .br-swell { transform: scale(1); opacity: 1; }
    .bean-roast.is-on .br-sheen { opacity: .34; transform: scale(.78); }
    .bean-roast.is-on .br-heat  { animation: bean-roast-hold 2.4s ease-in-out infinite !important; transform: scale(1); opacity: .22; }
  }

  /* ---------- Shell ---------- */
  .app-shell { max-width: 960px; margin: 0 auto; padding: 0 20px 80px; }
  .app-shell.is-wide { max-width: 1140px; }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 14px; margin-bottom: 8px;
    background: linear-gradient(var(--cream) 70%, rgba(244,238,225,0));
  }
  .brand { display: flex; align-items: center; gap: 12px; flex: none; }
  /* The wordmark is a link home. Styled to look like exactly what it looked like before — a bare
     button with no chrome — because a lockup that grows a border is a lockup that reads as a
     control, and this one should only announce itself on hover. */
  .brand-home {
    background: none; border: none; padding: 0; margin: 0; cursor: pointer; text-align: left;
    border-radius: 8px; transition: opacity .12s;
  }
  .brand-home:hover { opacity: .7; }
  .brand-home:focus-visible { outline: none; box-shadow: 0 0 0 3px #e7d9c2; }
  /* Same rule as the buttons: the lockup wraps as a unit or not at all. It was breaking into
     "Bean." over "INBOX TRIAGE" at widths where there was room for both. */
  .wordmark, .tagline { white-space: nowrap; }
  .wordmark { font-size: 25px; font-weight: 700; letter-spacing: -.5px; line-height: 1; color: var(--ink); }
  .tagline { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--bean); margin-top: 4px; letter-spacing: 3px; }
  /* Two clusters — state, then actions — with a hairline between, so six controls read as two
     groups rather than one undifferentiated row. Wraps as a row when it must; nothing is hidden
     behind a menu, because an unreachable destination is a worse problem than a tight row. */
  .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .topbar-sep { width: 1px; height: 20px; background: var(--line); flex: none; margin: 0 2px; }

  /* A long reply, clamped rather than truncated — the whole text is one click away. Correction
     rows rendered in full, so eight of them was a very long scroll to see eight rows. */
  .admin-clamp { margin-top: 8px; }
  .admin-clamp > summary {
    list-style: none; cursor: pointer; font-size: 12.5px; color: var(--ink-soft);
    background: var(--cream-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .admin-clamp > summary::-webkit-details-marker { display: none; }
  .admin-clamp-peek {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; white-space: pre-wrap;
  }
  .admin-clamp[open] > summary { display: none; }
  .admin-clamp-full {
    font-size: 12.5px; color: var(--ink-soft); background: var(--cream-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap;
  }
  .proton-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
    background: var(--paper); border: 1.5px solid var(--line);
    padding: 6px 12px; border-radius: 999px;
  }
  .proton-dot { width: 8px; height: 8px; border-radius: 999px; background: #E0A92E; box-shadow: 0 0 0 3px #FBF1DA; }
  .proton-pill.is-live .proton-dot { background: #4CA35A; box-shadow: 0 0 0 3px #EAF6EC; }

  /* ---------- Inbox greeting ---------- */
  .greet-card {
    display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 20px; padding: 22px 24px; margin-bottom: 26px;
    box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .greet-card::after {
    content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px;
    background: radial-gradient(circle, #efe6d6 0%, transparent 70%); pointer-events: none;
  }
  .greet-bean { margin: 2px; }
  .greet-text h1 { margin: 0 0 6px; font-size: 23px; font-weight: 600; }
  .greet-text p { margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 60ch; }
  .greet-text b { color: var(--ink); }
  .greet-action { grid-column: 1 / -1; }

  /* ---------- Inbox groups ---------- */
  .inbox-group { margin-bottom: 26px; }
  .group-head { display: flex; align-items: center; gap: 9px; margin: 0 4px 11px; flex-wrap: wrap; }
  .group-dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .group-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .group-blurb { font-size: 13px; color: var(--ink-faint); font-weight: 600; }
  .group-count {
    margin-left: auto; font-size: 12.5px; font-weight: 800; color: var(--ink-soft);
    background: var(--cream-2); border: 1.5px solid var(--line); border-radius: 999px;
    min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; padding: 0 7px;
  }
  .group-rows { display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Inbox filter bar ---------- */
  /* A lens above the list, in the same paper/cream language as the rows it filters. */
  .inbox-filter {
    display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 11px 15px; margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .inbox-filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .inbox-filter-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-faint); margin-right: 2px; }
  .filter-pill {
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
    background: var(--cream-2); border: 1.5px solid var(--line);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: all .12s;
  }
  .filter-pill:hover { border-color: var(--bean); color: var(--ink); }
  .filter-pill.is-on { color: var(--bean); background: #f1e7d6; border-color: #e4d3b4; }
  .filter-pill .fp-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  /* Label dropdown — a native select restyled to read as Bean (the browser default clashed with the
     pills next to it). appearance:none strips the OS chrome; the wrapper draws our own chevron. */
  .category-select-wrap { position: relative; display: inline-flex; }
  .category-select-wrap::after {
    content: '▾'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-size: 10px; color: var(--ink-faint); pointer-events: none;
  }
  .category-select {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    font-family: inherit; font-size: 12px; font-weight: 700; color: var(--ink-soft);
    background: var(--cream-2); border: 1.5px solid var(--line);
    padding: 5px 26px 5px 11px; border-radius: 999px; cursor: pointer; transition: all .12s;
    max-width: 220px; text-overflow: ellipsis;
  }
  .category-select:hover { border-color: var(--bean); color: var(--ink); }
  .category-select:focus { outline: none; border-color: var(--bean); }
  /* Clear-FYI: a quiet destructive action — legible, not loud, and it lives on the filed lane only. */
  .filed-head { display: flex; align-items: center; gap: 12px; }
  /* "What me can do now" on the inbox. A card, not a modal — it sits above the greeting and can be
     scrolled past, which is the whole difference between telling her and interrupting her. */
  .whatsnew-card {
    display: flex; gap: 14px; align-items: flex-start; position: relative;
    background: linear-gradient(180deg, #FFFDF8 0%, var(--cream-2) 100%);
    border: 1.5px solid #E8D9BE; border-radius: 18px; padding: 16px 44px 16px 16px;
    margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .whatsnew-bean { flex: none; margin-top: 2px; }
  .whatsnew-body { min-width: 0; }
  .whatsnew-kicker {
    font-size: 10.5px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase;
    color: var(--bean); margin-bottom: 3px;
  }
  .whatsnew-card h3 { margin: 0 0 4px; font-size: 15.5px; font-weight: 700; }
  .whatsnew-card p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); }
  .whatsnew-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .whatsnew-where { font-size: 12px; font-weight: 800; color: var(--ink-faint); }
  .whatsnew-more {
    font-family: inherit; font-size: 12px; font-weight: 800; color: var(--bean);
    background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline;
  }
  .whatsnew-more:hover { color: var(--ink); }
  .whatsnew-x {
    position: absolute; top: 10px; right: 12px; font-family: inherit; font-size: 18px; line-height: 1;
    color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 4px 6px;
    border-radius: 8px;
  }
  .whatsnew-x:hover { color: var(--ink); background: #F0E6D4; }

  /* The Beanary hint — "press me and me does a little roast".
     ⚠️ THIS BLOCK IS THE FIX FOR A REAL DEFECT, not decoration. bean-root.jsx has rendered
     `.beanary-hint` since the Beanary shipped, and the class had NO rule anywhere in this file — so
     the hint fell out of the layout as unstyled black text at the very bottom of the document,
     under the last card, in the browser default font. It looked like debug output that had escaped,
     and it has been live for the operator the whole time. The lesson is small and worth keeping:
     a className in a .jsx file is not a promise that a stylist ever saw it, and nothing in the
     build fails when the rule is missing — only a screenshot catches it. */
  /* Stacked ABOVE the chat launcher, not beside it: `.bean-chat-root` is fixed at left 20 / bottom
     20 with a 50px button, so the obvious corner is already taken and a nub placed there is simply
     covered by it — which is what the first attempt at this rule did. */
  .beanary-hint {
    position: fixed; left: 20px; bottom: 88px; z-index: 40; max-width: 320px;
    display: flex; align-items: center; gap: 8px;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 10px 12px; box-shadow: var(--shadow-lg); cursor: pointer;
    font-size: 12.5px; line-height: 1.45; color: var(--ink-soft);
  }
  .beanary-hint:hover { border-color: #DCCFB6; }
  .beanary-hint-x {
    flex: none; font-family: inherit; font-size: 15px; line-height: 1;
    color: var(--ink-faint); background: none; border: none; cursor: pointer;
    padding: 2px 4px; border-radius: 7px;
  }
  .beanary-hint-x:hover { color: var(--ink); background: #F0E6D4; }

  /* ---- The demo tour (web/bean-tour.jsx). Demo deployments only. ----
     A bar pinned to the bottom, NOT a modal with a backdrop. The last step's whole ask is "have a
     click around", and a scrim over the page would eat the click it just invited. So the tour never
     covers the inbox; it rings the row it is talking about and leaves everything else live. */
  .bean-tour {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 60;
    width: min(680px, calc(100vw - 32px));
    display: flex; align-items: flex-start; gap: 14px;
    background: var(--paper); border: 1.5px solid #E8D9BE; border-radius: 18px;
    padding: 16px 44px 16px 16px; box-shadow: var(--shadow-lg);
  }
  .bean-tour-mark { flex: none; margin-top: 2px; }
  .bean-tour-body { min-width: 0; flex: 1; }
  .bean-tour-count {
    font-size: 10.5px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase;
    color: var(--bean); margin-bottom: 3px;
  }
  .bean-tour h3 { margin: 0 0 4px; font-size: 15.5px; font-weight: 700; }
  .bean-tour p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); }
  .bean-tour-acts { flex: none; display: flex; align-items: center; gap: 8px; align-self: flex-end; }
  .bean-tour-back, .bean-tour-next {
    font-family: inherit; font-size: 12px; font-weight: 800; letter-spacing: .3px;
    padding: 7px 15px; border-radius: 999px; cursor: pointer; transition: all .12s; white-space: nowrap;
  }
  .bean-tour-back { color: var(--ink-faint); background: none; border: 1.5px solid var(--line); }
  .bean-tour-back:hover { color: var(--ink); border-color: #DCCFB6; }
  .bean-tour-next { color: var(--paper); background: var(--bean); border: 1.5px solid var(--bean); }
  .bean-tour-next:hover { background: #5B3720; border-color: #5B3720; }
  .bean-tour-x {
    position: absolute; top: 10px; right: 12px; font-family: inherit; font-size: 18px; line-height: 1;
    color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 4px 6px;
    border-radius: 8px;
  }
  .bean-tour-x:hover { color: var(--ink); background: #F0E6D4; }
  /* The demo's join line, under the greeting. */
  .demo-join { margin-top: 10px !important; font-size: 13.5px; color: var(--ink-soft); }
  .demo-join a { color: var(--bean); font-weight: 700; text-decoration: underline; }
  .demo-join a:hover { color: var(--ink); }
  /* The ring on the row under discussion. Outline and not border: `.inbox-row` already carries a
     4px left border that IS its confidence colour, and growing a border here would shove the whole
     row's contents sideways on every step. */
  .bean-tour-spot {
    outline: 2.5px solid var(--bean); outline-offset: 3px;
    box-shadow: var(--shadow-lg); position: relative; z-index: 1;
  }
  @media (max-width: 620px) {
    .bean-tour { flex-wrap: wrap; }
    .bean-tour-acts { width: 100%; justify-content: flex-end; }
  }
  .clear-fyi {
    font-family: inherit; font-size: 11px; font-weight: 800; letter-spacing: .3px;
    color: var(--ink-faint); background: none; border: 1.5px solid var(--line);
    padding: 4px 11px; border-radius: 999px; cursor: pointer; transition: all .12s; flex: none;
  }
  .clear-fyi:hover { color: #B4472E; border-color: #E4C3B4; background: #FBEFE9; }
  .inbox-filter-count { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; color: var(--ink-faint); }
  .inbox-filter-clear { font-family: inherit; font-size: 12px; font-weight: 800; color: var(--bean); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
  .inbox-filter-clear:hover { color: var(--ink); }
  .inbox-empty-filter {
    font-size: 13px; color: var(--ink-soft); background: var(--cream-2);
    border: 1.5px dashed var(--line); border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 22px;
  }

  .inbox-row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    width: 100%; text-align: left; background: var(--paper);
    border: 1.5px solid var(--line); border-left-width: 4px;
    border-radius: 14px; padding: 14px 16px; cursor: pointer;
    transition: transform .1s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow: var(--shadow); font-family: inherit;
  }
  .inbox-row:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .inbox-row.is-done { opacity: .58; box-shadow: none; }
  .row-avatar {
    width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; flex: none;
  }
  .row-main { min-width: 0; }
  .row-line1 { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; overflow: hidden; }
  .row-from { font-weight: 700; font-size: 14px; white-space: nowrap; flex: none; }
  .cat-tag {
    font-size: 11px; font-weight: 700; color: var(--ink-soft);
    background: var(--cream-2); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 6px; white-space: nowrap;
  }
  .row-subject { font-weight: 700; font-size: 14.5px; color: var(--ink); margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-snippet { font-size: 13px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  .row-time { font-size: 11.5px; color: var(--ink-faint); font-weight: 700; }
  /* The per-row Clear. Always rendered, never hover-only: a control that only exists on hover does
     not exist on a phone, and she triages on one. Quiet until touched so it never competes with the
     confidence badge, which is the thing the row is actually saying. */
  .row-clear {
    font-size: 11px; font-weight: 800; letter-spacing: .3px; color: var(--ink-faint);
    border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer;
    transition: all .12s; user-select: none;
  }
  .row-clear:hover { color: #B4472E; border-color: #E4C3B4; background: #FBEFE9; }
  .row-clear:focus-visible { outline: none; box-shadow: 0 0 0 3px #e7d9c2; }
  .row-status { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
  .row-status.approved, .row-status.handled { color: #2E7D3E; background: #EAF6EC; }
  .row-status.skipped { color: #9A6A12; background: #FBF1DA; }
  .done-group { margin-top: 8px; }
  .done-group .inbox-row { background: var(--cream-2); }

  /* ---------- Draft view ---------- */
  /* The open email, the screen she spends her day on. A sticky bar carries the subject, ONE
     confidence pill and the actions, so grading never costs a scroll; below it the email takes 5 of
     12 columns and the draft 7, because the draft is what she acts on. Prose — the mail, the draft,
     her notes — is set in IBM Plex Sans: in a proportional face it runs about a third shorter than
     in Courier and reads like mail. Bean's Courier stays on the brand, the labels and the pill. */
  .app-shell.is-draft { max-width: 1440px; }
  /* The topbar scrolls away here instead of sticking: the draft bar takes the top edge, and two
     stacked sticky bars would eat a fifth of a laptop screen. */
  .app-shell.is-draft .topbar { position: static; margin-bottom: 0; background: none; }
  .draft-view { animation: fadeUp .25s ease; font-family: var(--sans); }
  @keyframes fadeUp { from { transform: translateY(8px); } to { transform: none; } }
  .back-btn {
    background: var(--paper); border: 1.5px solid var(--line); color: var(--ink-soft);
    font-size: 13.5px; font-weight: 800; padding: 8px 14px; border-radius: 999px; cursor: pointer; margin-bottom: 16px;
  }
  .back-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  .dv-bar { position: sticky; top: 0; z-index: 20; margin-bottom: 20px; background: rgba(244,238,225,.94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-bottom: 1.5px solid var(--line); }
  .dv-bar-in { display: flex; align-items: center; gap: 16px; padding: 12px 0; }
  .dv-bar .back-btn { margin: 0; flex: none; border: 0; background: none; padding: 6px 4px; border-radius: 8px; font-family: var(--mono); font-size: 13px; font-weight: 700; }
  .dv-title { flex: 1; min-width: 0; }
  .dv-title h2 { margin: 0; font-family: var(--sans); font-size: 17px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dv-from { font-size: 13px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dv-bar .conf-badge { flex: none; font-family: var(--mono); }
  .conf-badge.is-filed { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; color: #8A7F6C; background: #F4EFE6; border: 1.5px solid #E4DCCB; }
  .dv-acts { display: flex; align-items: center; gap: 8px; flex: none; }
  .dv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 13.5px; font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer; transition: background .12s, border-color .12s; }
  .dv-btn:hover:not(:disabled) { border-color: var(--ink-faint); }
  .dv-btn.is-primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  .dv-btn.is-primary:hover:not(:disabled) { background: #C98E22; border-color: #C98E22; }
  .dv-btn.is-soft { background: var(--cream-2); border-color: transparent; color: var(--ink-soft); }
  .dv-btn.is-soft:hover:not(:disabled) { border-color: var(--line); }
  .dv-btn:disabled { opacity: .6; cursor: default; }
  .dv-btn:focus-visible, .dv-bar .back-btn:focus-visible, .dv-menu-item:focus-visible, .draft-tool:focus-visible,
  .sources-head:focus-visible, .mail-earlier-head:focus-visible, .mail-more:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .dv-more { position: relative; }
  .dv-more-btn { min-width: 40px; font-weight: 700; }
  .dv-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; min-width: 250px; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; box-shadow: 0 12px 30px rgba(58,48,32,.14); }
  .dv-menu-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; font-family: var(--sans); font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .dv-menu-item:hover { background: var(--cream-2); }
  .dv-menu-narrow { display: none; }
  .category-picker { display: flex; flex-direction: column; gap: 5px; padding: 8px 10px; }
  .category-picker-label { font-size: 13.5px; color: var(--ink); }
  .category-select { font: inherit; font-size: 13.5px; color: var(--ink-soft); background: var(--cream-2); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; cursor: pointer; width: 100%; }
  .category-select:focus { outline: none; border-color: var(--bean); }
  .dv-menu-hint { margin-top: 4px; padding: 8px 10px 4px; border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--ink-faint); }
  .dv-notice { margin: 0 0 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: #9A6A12; background: #FBF1DA; border: 1.5px solid #EAD6A2; border-radius: 10px; }

  .draft-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
  /* A grid item's min-width is `auto`, so it refuses to shrink below its longest unbreakable word.
     Real mail is full of them — a 200-char tracking URL in a marketing email widened this column
     past its 1fr, overflowed the grid, and shoved BOTH panes off-screen (the body clipped at the
     left edge). Same fix as .row-main above: let the column shrink, and let the words break. */
  .draft-grid > * { min-width: 0; }

  .email-panel { background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
  .email-body p { margin: 0 0 12px; color: #4a4338; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
  .email-body p:last-child { margin-bottom: 0; }
  /* Linkified tracking URLs are one enormous "word". Break them rather than let them decide the
     page width. `anywhere` (not break-all) so ordinary prose still wraps on spaces. */
  .email-body a { overflow-wrap: anywhere; }

  /* The email column: the latest message first, everything earlier folded into one row under it. */
  .mail-col { display: flex; flex-direction: column; gap: 12px; }
  .mail-card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .mail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .email-avatar { width: 40px; height: 40px; border-radius: 10px; background: #ECE6FA; color: #6B4FD8; display: grid; place-items: center; flex: none; font-family: var(--mono); font-weight: 700; font-size: 13px; }
  .mail-who { flex: 1; min-width: 0; }
  /* A long sender name wrapped to two lines and the absolute-width time sat on top of it. The name
     truncates instead: the address below it and the thread bylines already carry identity, and a
     collision reads as broken in a way a clipped name does not. */
  .email-from { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-addr { display: flex; flex-wrap: wrap; column-gap: 8px; font-size: 13px; color: var(--ink-faint); }
  .mail-addr-text { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email-time { margin-left: auto; align-self: flex-start; flex: none; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mail-repeat { margin: -4px 0 10px; font-size: 13px; font-weight: 600; color: #B5462E; }
  .mail-body .email-body p { color: var(--ink); max-width: 68ch; margin-bottom: 10px; }
  .mail-body .email-body p:last-child { margin-bottom: 0; }
  .mail-more { display: none; border: 0; background: none; padding: 8px 0 0; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--bean); cursor: pointer; }
  .mail-earlier { background: var(--cream-2); border: 1.5px solid var(--line-soft); border-radius: 12px; }
  .mail-earlier-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 16px; border: 0; border-radius: 12px; background: none; text-align: left; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .mail-earlier-head:hover { color: var(--ink); }
  .mail-earlier-body { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 14px; border-top: 1.5px solid var(--line-soft); }

  /* The draft column. */
  .bean-panel { display: flex; flex-direction: column; gap: 12px; }
  .draft-box { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(58,48,32,.07); transition: border-color .15s, box-shadow .15s; }
  .draft-box.is-editing { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(211,154,44,.16), 0 8px 24px rgba(58,48,32,.07); }
  .draft-box-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; padding: 8px 14px 0 20px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .draft-box-tools { display: flex; gap: 2px; }
  .draft-tool { border: 0; background: none; padding: 5px 7px; border-radius: 6px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--bean); white-space: nowrap; cursor: pointer; }
  .draft-tool:hover { background: var(--cream-2); }
  /* What she is about to send, set the way mail is set. The screen font is still free to differ
     from the email's: both copy paths AUTHOR the clipboard rather than inheriting the rendered css
     — CopyButton / copyDraft build their own html, and `draftCopyHandler` (bean-draft.jsx)
     intercepts a hand-selected Cmd+C — so what lands in the composer is COPY_STYLE (sans-serif
     14pt) whatever this rule says. A typewriter font once rode into every reply that way; if that
     handler is ever removed, this rule has to match COPY_STYLE instead. */
  .draft-text { padding: 8px 20px 20px; font-family: var(--sans); font-size: 15.5px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .draft-edit { display: block; width: 100%; min-height: 180px; margin: 0; padding: 8px 20px 20px; border: 0; background: none; outline: none; resize: none; overflow: hidden; font-family: var(--sans); font-size: 15.5px; line-height: 1.6; color: var(--ink); }

  .draft-view .why-block { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 18px; }
  .draft-view .why-label { margin: 0 0 6px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .draft-view .why-block.is-low { background: #FBF1DA; border-color: #EAD6A2; }
  .draft-view .why-block.is-low .why-label { color: #9A6A12; }
  .draft-view .why-block.is-flag { background: #FBE7E0; border-color: #F1C3B4; }
  .draft-view .why-block.is-flag .why-label { color: #B5462E; }
  /* Green's reason IS its grounding, so its "why" is the sources line itself, led by a label. */
  .draft-view .why-block.is-high { background: none; border: 0; padding: 0; }
  .draft-view .why-block.is-high .why-label { margin: 0; color: #2E7D3E; }
  .why-list { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; color: var(--ink); }
  .why-list li { margin: 3px 0; }
  .why-block.is-high .why-list { margin-top: 8px; }
  .sources-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 2px 0; border: 0; background: none; text-align: left; font-family: var(--sans); font-size: 13px; color: var(--ink-soft); cursor: pointer; border-radius: 6px; }
  .sources-text { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .sources-head:hover .sources-text { text-decoration-color: var(--ink-faint); }
  .cite-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cite-chip { display: inline-flex; align-items: center; gap: 5px; max-width: 260px; padding: 3px 10px; border-radius: 999px; border: 1.5px solid; font-family: var(--sans); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .cite-chip.is-inert { cursor: default; }

  .bean-says { display: flex; gap: 14px; align-items: flex-start; border: 1.5px solid; border-radius: 12px; padding: 16px 18px; }
  .bean-says.is-filed { background: #F4EFE6; border-color: #E4DCCB; }
  .bean-says-title { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .bean-says.is-filed .bean-says-title { color: #8A7F6C; }
  .bean-says-body { font-size: 14px; color: var(--ink-soft); line-height: 1.45; }

  .why-block { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 15px 17px; }
  .why-block.subtle { background: var(--cream-2); }
  .why-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-faint); margin-bottom: 10px; }

  .bean-note { font-size: 13px; line-height: 1.5; color: #6a5a30; background: #FBF1DA; border: 1.5px dashed #E0A92E; border-radius: 12px; padding: 12px 15px; }
  .bean-note b { color: #7a5410; }

  .no-draft { display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); background: repeating-linear-gradient(135deg, #f6f1e6, #f6f1e6 9px, #f1ebde 9px, #f1ebde 18px); border: 1.5px dashed var(--line); border-radius: 12px; padding: 16px 18px; }
  .no-draft .draft-tool { margin-left: auto; flex: none; background: var(--paper); border: 1.5px solid var(--line); }

  .bean-btn:hover:not([disabled]) { transform: translateY(-1px); }
  .bean-btn:active:not([disabled]) { transform: translateY(1px); box-shadow: none !important; }

  .conf-badge { font-family: inherit; letter-spacing: 0; }

  /* ---------- Toast ---------- */
  .bean-toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px);
    display: flex; align-items: center; gap: 12px;
    background: var(--ink); color: #fff8ee; font-weight: 700; font-size: 14.5px;
    padding: 12px 18px 12px 14px; border-radius: 14px; box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s cubic-bezier(.2,.9,.3,1.2); z-index: 60;
    max-width: 90vw;
  }
  .bean-toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* A failed write must not look like a saved one. Amber rail — the same warning colour the low-
     confidence draft state uses, so "Bean isn't sure" and "Bean couldn't save" read as one family. */
  .bean-toast.is-warn { border-left: 4px solid #E8A87C; padding-left: 14px; }

  /* ---------- Bean chat ----------
     z-index: the toast owns 60 at bottom-centre; the launcher and panel sit at 50 on the left,
     so the two never overlap on desktop. Below 420px the panel is a bottom sheet and the launcher
     lifts to clear the toast instead of sitting under it. */

  .bean-chat-root { position: fixed; left: 20px; bottom: 20px; z-index: 50; }

  .bean-chat-launcher {
    position: relative; display: grid; place-items: center;
    width: 50px; height: 50px; padding: 0;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px;
    box-shadow: var(--shadow); cursor: pointer;
    transition: transform .2s cubic-bezier(.2,.9,.3,1.2), border-color .15s;
  }
  .bean-chat-launcher:hover { transform: translateY(-2px); border-color: #DBCDB4; }
  .bean-chat-launcher:focus-visible { outline: none; box-shadow: var(--shadow), 0 0 0 3px #e7d9c2; }
  .bean-chat-root.is-open .bean-chat-launcher { transform: scale(.86); opacity: .55; }

  /* Something is waiting on her judgment. Amber, not red — a proposal is a question, not a failure. */
  .bean-chat-dot {
    position: absolute; top: 1px; right: 1px;
    width: 11px; height: 11px; border-radius: 999px;
    background: #E0A92E; box-shadow: 0 0 0 2.5px var(--paper);
  }

  /* Grows out of the launcher, not in from the screen edge — same spring the toast uses. */
  .bean-chat-panel {
    position: absolute; left: 0; bottom: 62px;
    width: 380px; height: 540px; max-height: calc(100vh - 110px);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow-lg);
    transform-origin: bottom left;
    transform: scale(.6) translateY(12px); opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .28s cubic-bezier(.2,.9,.3,1.2);
  }
  .bean-chat-root.is-open .bean-chat-panel {
    transform: scale(1) translateY(0); opacity: 1; pointer-events: auto;
  }

  .chat-head {
    display: flex; align-items: center; gap: 10px; flex: none;
    padding: 13px 14px; border-bottom: 1.5px solid var(--line-soft);
    background: linear-gradient(var(--cream-2), var(--paper));
  }
  .chat-head-title { font-size: 15px; font-weight: 700; letter-spacing: -.2px; line-height: 1.2; }
  .chat-head-sub { font-size: 11px; color: var(--ink-faint); letter-spacing: .2px; }
  .chat-x {
    flex: none; width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
    background: transparent; border: none; color: var(--ink-faint); font-size: 19px; line-height: 1;
  }
  .chat-x:hover { background: var(--cream-2); color: var(--ink); }

  .chat-scroll { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 16px; }

  .chat-turn { display: flex; }
  .chat-turn-you { justify-content: flex-end; }
  .chat-bubble {
    max-width: 84%; background: var(--cream-2); border: 1.5px solid var(--line);
    border-radius: 14px 14px 4px 14px; padding: 9px 13px;
    font-size: 13.5px; line-height: 1.55; color: var(--ink); text-wrap: pretty;
  }
  /* Bean gets no bubble. She is the paper; the operator is the visitor on it. */
  .chat-turn-bean { gap: 9px; align-items: flex-start; }
  .chat-gutter { flex: none; width: 20px; padding-top: 2px; }
  .chat-said { flex: 1; min-width: 0; }
  .chat-line { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink); text-wrap: pretty; }
  .chat-line-faint { color: var(--ink-faint); }

  .chat-cites { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; }
  .chat-cites-lead { font-size: 11.5px; color: var(--ink-faint); }
  .chat-cite {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    border: 1px solid; border-radius: 999px; padding: 3px 9px; cursor: pointer;
  }
  .chat-cite:hover { filter: brightness(.97); }

  .chat-empty { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 12px; text-align: center; }
  .chat-empty-lead { font-size: 14.5px; font-weight: 700; color: #3a342c; }
  .chat-empty-sub { font-size: 12.5px; line-height: 1.6; color: var(--ink-faint); max-width: 260px; text-wrap: pretty; }

  /* Composer — PaperText's idiom (bean-notebook.jsx): no box, a faint underline only while she's in it. */
  .chat-composer {
    flex: none; display: flex; align-items: flex-end; gap: 8px;
    padding: 11px 12px 12px; border-top: 1.5px solid var(--line-soft); background: var(--paper);
  }
  .chat-input {
    flex: 1; min-width: 0; resize: none; overflow-y: auto; max-height: 132px;
    border: none; border-bottom: 1.5px solid transparent; background: transparent;
    outline: none; font: inherit; font-size: 13.5px; line-height: 1.6; color: #4A4236;
    padding: 4px 0; transition: border-color .15s;
  }
  .chat-input:focus { border-bottom-color: #D9CBA6; }
  .chat-input::placeholder { color: var(--ink-faint); }
  .chat-send {
    flex: none; width: 32px; height: 32px; border-radius: 10px; cursor: pointer;
    background: var(--bean); color: #fff8ee; border: none; font-family: inherit; font-size: 15px; line-height: 1;
    transition: opacity .15s;
  }
  .chat-send:disabled { opacity: .3; cursor: default; }

  @media (max-width: 420px) {
    .bean-chat-root { left: 14px; right: 14px; bottom: 88px; }
    /* The launcher rises to 88px here, so the nub above it has to rise with it or they overlap. */
    .beanary-hint { left: 14px; right: 14px; bottom: 152px; max-width: none; }
    .bean-chat-panel {
      position: fixed; left: 0; right: 0; bottom: 0; width: auto;
      height: 78vh; max-height: none;
      border-radius: 20px 20px 0 0; border-bottom: none;
      transform-origin: bottom center;
      transform: translateY(14px) scale(.98);
    }
    .bean-chat-root.is-open .bean-chat-panel { transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bean-chat-panel { transition: opacity .12s linear; transform: none; }
    .bean-chat-root.is-open .bean-chat-panel { transform: none; }
    .bean-chat-launcher, .bean-chat-root.is-open .bean-chat-launcher { transition: none; transform: none; }
  }

  /* ---------- Thread history + Shopify links (draft view) ---------- */
  /* Quiet links in the sender line, after the address: "addr · Customer ↗ · #1234 ↗". */
  .shopify-link { font-size: 12.5px; font-weight: 500; color: #3D5BD9; text-decoration: none; white-space: nowrap; }
  .shopify-link::before { content: '·'; color: var(--ink-faint); margin-right: 8px; }
  .shopify-link:hover { text-decoration: underline; }
  .thread-history { display: flex; flex-direction: column; }
  .thread-msg { border-left: 3px solid var(--line); padding: 0 0 0 11px; margin-bottom: 10px; }
  .thread-msg p { margin: 0 0 5px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
  .thread-msg p:last-child { margin-bottom: 0; }
  .thread-msg-head { display: flex; align-items: baseline; gap: 7px; width: 100%; background: none; border: 0; padding: 0 0 4px; margin: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; min-width: 0; }
  .thread-msg.is-collapsed .thread-msg-head { padding-bottom: 0; }
  /* The triangles come from the system face: IBM Plex Sans has no ▸, and its fallback rendered it as a speck. */
  .thread-caret, .sources-caret { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; color: var(--ink-faint); flex: none; }
  /* Byline and peek both truncate rather than wrap or overflow: `min-width:0` is what lets a flex
     child shrink below its content width, without which the ellipsis never fires and the text is
     sliced off mid-character at the card edge. The byline shrinks last — it is the useful half. */
  .thread-who { font-size: 11.5px; font-weight: 700; color: var(--ink-faint); white-space: nowrap; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .thread-peek { font-size: 12px; color: var(--ink-faint); opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
  .thread-body { max-height: 260px; overflow-y: auto; }
  .thread-pill { font-size: 10.5px; font-weight: 800; color: var(--bean); background: #f1e7d6; border: 1px solid #e2d0b6; padding: 1px 7px; border-radius: 999px; white-space: nowrap; letter-spacing: .2px; }
  /* Warmer than the thread pill and deliberately louder: an unanswered chase is the one thing in a
     row that is about the CUSTOMER's patience rather than about Bean's confidence. */
  .chase-pill { font-size: 10.5px; font-weight: 800; color: #9a4b2e; background: #fbe9df; border: 1px solid #f0cdb9; padding: 1px 7px; border-radius: 999px; white-space: nowrap; letter-spacing: .2px; }
  /* One customer's unanswered conversation, as one thing to act on. The card is a hairline around
     the row she taps — the members underneath are secondary, so they never compete with it. */
  .convo-card { border: 1.5px solid #f0cdb9; border-radius: 16px; background: #fdf5ef; padding: 5px; }
  .convo-card-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 10px 5px; }
  .convo-more, .convo-redraft {
    font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
    background: none; border: none; padding: 2px 0; color: #9a4b2e; letter-spacing: .2px;
  }
  .convo-more:hover { text-decoration: underline; }
  .convo-redraft {
    margin-left: auto; border: 1px solid #f0cdb9; background: var(--paper);
    border-radius: 999px; padding: 4px 11px;
  }
  .convo-redraft:hover:not(:disabled) { background: #fbe9df; }
  .convo-redraft:disabled { opacity: .6; cursor: default; }
  .convo-card-rows { display: flex; flex-direction: column; gap: 8px; padding: 3px 0 5px; }
  /* Members read as inset under the row that answers them, not as peers of it. */
  .convo-card-rows .inbox-row { margin-left: 18px; opacity: .85; }

  .convo-strip { background: #fbe9df; border: 1.5px solid #f0cdb9; border-radius: 12px; padding: 12px 14px; }
  .convo-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #9a4b2e; margin-bottom: 9px; }
  .convo-msg { border-left: 3px solid #f0cdb9; padding-left: 11px; margin-bottom: 10px; }
  .convo-msg:last-child { margin-bottom: 0; }
  .convo-when { font-size: 11px; font-weight: 700; color: #9a4b2e; opacity: .8; margin-bottom: 3px; }
  .convo-body { max-height: 190px; overflow-y: auto; }
  .convo-body p { margin: 0 0 5px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
  .convo-body p:last-child { margin-bottom: 0; }

  /* ---------- Teach-Bean entry ---------- */
  .teach-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800;
    color: var(--bean); background: var(--paper); border: 1.5px solid var(--line);
    padding: 6px 9px; border-radius: 999px; cursor: pointer; font-family: inherit;
    /* A pill that wraps mid-label reads as broken rather than as tight. The ROW may wrap; the
       buttons in it may not. "Teach Bean (43 left)" was the one that gave it away. */
    white-space: nowrap; flex: none;
  }
  .teach-btn:hover { border-color: var(--bean); }
  /* "(43 left)" cost ~45px and pushed Settings onto a second row. A badge says the same thing in
     a third of the space, and reads as a count rather than as part of the label. */
  /* Something new to read. Amber like the chat's pending dot — the same "worth a look, not a
     problem" colour, so the two never read as different kinds of signal. */
  .new-dot {
    width: 7px; height: 7px; border-radius: 999px; background: #E0A92E; flex: none;
    margin-left: 1px;
  }
  .teach-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    background: var(--bean); color: #fff8ee; font-size: 10.5px; font-weight: 800; line-height: 1;
  }

  /* ---------- Admin surface ---------- */
  .admin-view { animation: fadeUp .25s ease; }
  .admin-shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; align-items: start; }
  /* The settings surface reads wider than the inbox does: it is dense records, not a scan list.
     The widening has to happen on the SHELL — everything renders inside it, so a max-width on the
     inner view alone is a no-op against the shell's 960. Only this view opts in; the inbox keeps
     its comfortable measure. */
  .admin-nav {
    position: sticky; top: 84px; display: flex; flex-direction: column; gap: 3px;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: var(--shadow);
  }
  .admin-nav-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-faint); padding: 6px 10px 8px; }
  .admin-nav-btn { text-align: left; background: none; border: none; font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); padding: 9px 11px; border-radius: 10px; cursor: pointer; }
  .admin-nav-btn:hover { background: var(--cream-2); color: var(--ink); }
  .admin-nav-btn.is-active { background: #f1e7d6; color: var(--bean); }
  .admin-body { min-width: 0; }
  .admin-section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .admin-section-head h2 { margin: 0 0 3px; font-size: 19px; font-weight: 700; }
  .admin-section-head p { margin: 0; font-size: 13.5px; color: var(--ink-soft); max-width: 56ch; }
  .admin-add-btn { background: var(--bean); color: #fff8ee; border: none; font-family: inherit; font-weight: 800; font-size: 13px; padding: 9px 15px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .admin-add-btn:hover { filter: brightness(1.08); }
  .admin-card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; margin-bottom: 11px; box-shadow: var(--shadow); overflow: hidden; }
  .admin-card-head { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; font-family: inherit; padding: 15px 17px; cursor: pointer; }
  .admin-card-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .admin-card-chev { margin-left: auto; color: var(--ink-faint); font-size: 13px; }
  .template-badge, .escalate-badge { font-size: 10.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px; letter-spacing: .2px; }
  .template-badge { color: #2E7D3E; background: #EAF6EC; border: 1px solid #BFE3C6; }
  .escalate-badge { color: #B5462E; background: #FBE7E0; border: 1px solid #F1C3B4; }
  .admin-card-body { padding: 4px 17px 17px; border-top: 1.5px solid var(--line-soft); }
  .admin-card-body.open { border-top: none; padding-top: 15px; }
  .admin-field { margin-top: 14px; }
  .admin-field:first-child { margin-top: 0; }
  .admin-label { font-size: 12.5px; font-weight: 800; color: var(--ink); margin-bottom: 5px; }
  .admin-hint { font-size: 12px; color: var(--ink-faint); margin-bottom: 7px; line-height: 1.45; }
  .admin-input, .admin-textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 13.5px; line-height: 1.55; color: var(--ink); background: var(--cream-2); resize: vertical; }
  .admin-input:focus, .admin-textarea:focus { outline: none; border-color: var(--bean); background: var(--paper); box-shadow: 0 0 0 3px #e7d9c2; }
  .admin-note { margin-top: 12px; font-size: 12.5px; color: var(--ink-soft); background: var(--cream-2); border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
  .gap-warn { margin-top: 12px; font-size: 12.5px; font-weight: 700; color: #9A6A12; background: #FBF1DA; border: 1.5px solid #EAD6A2; border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
  .admin-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .admin-usage { font-size: 12px; font-weight: 700; color: var(--ink-faint); }
  .admin-del { background: none; border: none; color: #B5462E; font-family: inherit; font-weight: 800; font-size: 12.5px; cursor: pointer; }
  .admin-del:hover { text-decoration: underline; }
  .toggle { display: inline-flex; align-items: center; gap: 10px; background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; }
  .toggle-knob { width: 38px; height: 22px; border-radius: 999px; background: #d8cdb8; position: relative; transition: background .15s; flex: none; }
  .toggle-knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .toggle.is-on .toggle-knob { background: var(--bean); }
  .toggle.is-on .toggle-knob::after { transform: translateX(16px); }
  .toggle-label { font-size: 13px; font-weight: 700; color: var(--ink); }
  .url-preview { margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); word-break: break-all; line-height: 1.5; }
  .url-preview a { color: #4257d6; }
  .atom-group { margin-bottom: 18px; }
  .atom-group-head { font-size: 12px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 8px 3px; }
  .feedback-bar { display: flex; flex-direction: column; gap: 6px; }
  .feedback-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
  .feedback-head label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .feedback-like { flex: none; background: var(--cream-2); border: 1.5px solid var(--line); border-radius: 999px; font-family: inherit; font-weight: 600; font-size: 12.5px; color: var(--ink-soft); padding: 3px 12px; cursor: pointer; transition: all .15s; }
  .feedback-like:hover { border-color: var(--bean); color: var(--ink); }
  .feedback-like.is-on { background: #EAF6EC; border-color: #BFE3C6; color: #2E7D3E; }
  .feedback-comment { width: 100%; min-height: 46px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--paper); resize: vertical; }
  .feedback-comment:focus { outline: none; border-color: var(--bean); background: var(--paper); box-shadow: 0 0 0 3px #e7d9c2; }
  .gap-teach-btn { margin-top: 12px; width: 100%; background: var(--cream-2); border: 1.5px dashed var(--line); border-radius: 11px; font-family: inherit; font-weight: 800; font-size: 13px; color: var(--ink-soft); padding: 11px 14px; cursor: pointer; transition: all .15s; }
  .gap-teach-btn:hover { border-color: var(--bean); color: var(--bean); }
  .gap-capture { margin-top: 12px; padding: 14px; background: var(--cream-2); border: 1.5px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 9px; }
  .gap-saved { margin-top: 12px; font-size: 12.5px; font-weight: 700; color: #2E7D3E; background: #EAF6EC; border: 1.5px solid #BFE3C6; border-radius: 10px; padding: 11px 13px; line-height: 1.5; }

  /* ---------- Routing-tree Miller editor ---------- */
  /* Finder-style drill: one column per depth, a leaf editor as the last panel. Reads like the
     runtime routed path (A › B › C) because it IS the same tree, same confidence palette. */
  .tree-bc { font-size: 12px; color: var(--ink-soft); margin-bottom: 13px; min-height: 16px; }
  .tree-bc b { color: var(--bean); }
  .tree-cols { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
  .tree-col { flex: none; width: 190px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--cream-2); overflow: hidden; box-shadow: var(--shadow); }
  .tree-col-h { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-faint); padding: 9px 12px; border-bottom: 1px solid var(--line-soft); }
  .tree-row { display: flex; align-items: center; gap: 8px; padding: 9px 11px; cursor: pointer; border-bottom: 1px solid var(--line-soft); }
  .tree-row:last-of-type { border-bottom: none; }
  .tree-row:hover { background: var(--paper); }
  .tree-row.is-sel { background: var(--paper); box-shadow: inset 3px 0 0 var(--bean); }
  .tree-row .tree-lbl { flex: 1; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-row .tree-chev { color: var(--ink-faint); font-size: 13px; flex: none; }
  .tree-dot { width: 9px; height: 9px; border-radius: 999px; flex: none; box-sizing: border-box; }
  .tree-del { opacity: 0; color: #B5462E; font-weight: 800; cursor: pointer; padding: 0 2px; font-size: 12px; background: none; border: none; font-family: inherit; line-height: 1; flex: none; }
  .tree-row:hover .tree-del { opacity: .55; }
  .tree-del:hover { opacity: 1; }
  .tree-col-add { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 12px; font-weight: 800; color: var(--bean); background: transparent; border: none; border-top: 1px dashed var(--line); padding: 9px 12px; cursor: pointer; }
  .tree-col-add:hover { background: var(--paper); }
  .tree-leaf { width: 252px; flex: none; align-self: flex-start; border: 1.5px solid var(--bean); border-radius: 12px; background: var(--paper); padding: 14px; box-shadow: var(--shadow); }
  .tree-leaf-h { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; }
  .tree-leaf-h .tree-lbl { font-weight: 800; font-size: 14px; flex: 1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-typetag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex: none; }
  .tree-fld { margin-bottom: 11px; }
  .tree-fld:last-child { margin-bottom: 0; }
  .tree-fld label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-faint); margin-bottom: 5px; }
  .tree-ed { font-family: inherit; font-size: 13px; width: 100%; border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--cream-2); color: var(--ink); resize: vertical; line-height: 1.5; box-sizing: border-box; }
  .tree-ed:focus { outline: none; border-color: var(--bean); background: var(--paper); box-shadow: 0 0 0 3px #e7d9c2; }
  .tree-leaf-actions { display: flex; gap: 8px; margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .tree-btn-move { flex: 1; font-family: inherit; font-size: 12px; font-weight: 800; color: var(--bean); background: var(--paper); border: 1.5px solid var(--bean); border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  .tree-btn-move:hover { background: var(--bean); color: #fff8ee; }
  .tree-btn-del { flex: none; font-family: inherit; font-size: 12px; font-weight: 800; color: #B5462E; background: #FBE7E0; border: 1.5px solid #F1C3B4; border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  .tree-btn-del:hover { background: #B5462E; color: #fff; }
  /* point-at-destination move */
  .tree-move-banner { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; color: #9A6A12; background: #FBF1DA; border: 1.5px solid #EAD6A2; border-radius: 11px; padding: 10px 13px; margin-bottom: 13px; }
  .tree-move-banner .tree-x { margin-left: auto; color: var(--ink-soft); cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 3px 11px; font-weight: 800; background: var(--paper); font-family: inherit; font-size: 12px; flex: none; }
  .tree-move-banner .tree-x:hover { background: var(--cream); }
  .tree-row.is-target { cursor: copy; outline: 2px dashed #E0A92E; outline-offset: -2px; border-radius: 8px; }
  .tree-row.is-target:hover { background: #FBF1DA; }
  .tree-col-add.is-target { color: #9A6A12; border-top-color: #EAD6A2; }
  .tree-col-add.is-target:hover { background: #FBF1DA; }
  .tree-row.is-dim { opacity: .32; pointer-events: none; }
  /* Tree ⇄ Flat-list lens: same nodes, different projection — NOT a second editing surface. */
  .tree-toggle { display: inline-flex; background: var(--cream-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex: none; }
  .tree-toggle button { font-family: inherit; font-size: 12.5px; font-weight: 800; color: var(--ink-soft); background: none; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .tree-toggle button:hover { color: var(--ink); }
  .tree-toggle button.is-on { background: var(--paper); color: var(--bean); box-shadow: var(--shadow); }
  .tree-flat { display: flex; flex-direction: column; gap: 9px; }
  .tree-flat-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 15px; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .tree-flat-row:hover { border-color: var(--bean); transform: translateY(-1px); }
  .tree-flat-main { flex: 1; min-width: 0; }
  .tree-flat-path { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tree-flat-seg { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
  .tree-flat-seg.is-leaf { color: var(--ink); font-weight: 800; }
  .tree-flat-sep { color: var(--ink-faint); font-size: 11px; }
  .tree-flat-preview { font-size: 12px; color: var(--ink-faint); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }
  .tree-flat-empty { font-size: 12.5px; color: var(--ink-soft); background: var(--cream-2); border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px 14px; line-height: 1.5; }

  /* ---------- Outline tree editor ---------- */
  .ol-toggle { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; background: var(--cream-2); padding: 3px; }
  .ol-toggle button { font-family: inherit; font-size: 12.5px; border: 0; background: none; color: var(--ink-soft); padding: 6px 13px; border-radius: 7px; cursor: pointer; font-weight: 700; }
  .ol-toggle button.is-on { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
  .ol-cov { display: flex; gap: 9px; flex-wrap: wrap; margin: 0 0 16px; }
  .ol-cov-card { flex: 1 1 120px; min-width: 108px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--cream-2); padding: 10px 13px; }
  .ol-cov-card.hl { background: #f1e7d6; border-color: #e4d3b4; }
  .ol-cov-n { font-size: 20px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .ol-cov-card.hl .ol-cov-n { color: var(--bean); }
  .ol-cov-k { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .ol-wrap { border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); overflow: hidden; box-shadow: var(--shadow); }
  .ol-row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line-soft, #efe8da); }
  .ol-row:last-child { border-bottom: 0; }
  .ol-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; font-family: inherit; text-align: left; padding: 11px 8px; cursor: pointer; }
  .ol-main:hover { background: var(--cream-2); }
  .ol-row.is-catch .ol-main { background: #fbf5ec; }
  .ol-chev { width: 13px; flex: none; color: var(--ink-faint); font-size: 11px; text-align: center; }
  .ol-name { font-size: 13.5px; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ol-lock { font-size: 11px; flex: none; opacity: .7; }
  .ol-meta { flex: none; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .ol-acts { display: flex; gap: 5px; padding-right: 12px; flex: none; }
  .ol-acts button { width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 13px; line-height: 1; background: var(--cream-2); }
  .ol-add { border: 1px dashed #d8c6a0; color: var(--bean); }
  .ol-edit { border: 1.5px solid var(--line); color: var(--ink-soft); }
  .ol-acts button:hover { background: #f1e7d6; }
  .ol-map { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-soft, #efe8da); font-family: inherit; font-size: 12px; color: var(--ink-soft); line-height: 1.5; padding: 8px 12px 10px; cursor: pointer; }
  .ol-map:hover { background: var(--cream-2); }
  .ol-map-lab { font-weight: 800; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .3px; font-size: 10px; }
  .ol-map-empty { color: var(--bean); font-weight: 700; }
  .ol-addtop { display: block; width: 100%; text-align: left; margin-top: 10px; background: var(--cream-2); border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px 15px; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--bean); cursor: pointer; }
  .ol-addtop:hover { background: #f1e7d6; border-color: #e4d3b4; }
  .ol-empty { font-size: 12.5px; color: var(--ink-soft); background: var(--cream-2); border: 1.5px dashed var(--line); border-radius: 12px; padding: 20px; line-height: 1.5; text-align: center; }
  .ol-flat { display: flex; flex-direction: column; gap: 9px; }
  .ol-flat-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 15px; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .ol-flat-row:hover { border-color: var(--bean); transform: translateY(-1px); }
  .ol-flat-main { flex: 1; min-width: 0; }
  .ol-flat-trail { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ol-flat-seg { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
  .ol-flat-seg::after { content: '›'; margin-left: 6px; color: var(--ink-faint); font-weight: 400; }
  .ol-flat-seg:last-child::after { content: ''; }
  .ol-flat-seg.is-leaf { color: var(--ink); font-weight: 800; }
  .ol-flat-prev { font-size: 12px; color: var(--ink-faint); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Edit sheet + move modal ---------- */
  .es-scrim { position: fixed; inset: 0; background: rgba(44, 32, 16, .42); display: flex; align-items: flex-end; justify-content: center; z-index: 60; }
  .es-sheet { width: 640px; max-width: 100%; max-height: 94vh; overflow: auto; background: var(--cream-2); border: 1.5px solid var(--line); border-radius: 20px 20px 0 0; box-shadow: 0 30px 80px -28px rgba(58, 40, 20, .55); }
  .es-head { display: flex; align-items: center; gap: 11px; padding: 18px 22px; border-bottom: 1px solid var(--line-soft, #efe8da); position: sticky; top: 0; background: var(--cream-2); z-index: 2; }
  .es-title { font-size: 17px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .es-badge { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; padding: 4px 10px; border-radius: 999px; flex: none; }
  .es-x { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; font-size: 14px; color: var(--ink-soft); }
  .es-body { padding: 18px 22px 4px; }
  .es-field { margin-bottom: 18px; }
  .es-lab { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-faint); margin-bottom: 6px; }
  .es-hint { font-size: 11.5px; color: var(--ink-faint); font-style: italic; margin: -2px 0 7px; }
  .es-path { font-size: 12.5px; color: var(--bean); margin-bottom: 18px; }
  .es-seg { display: flex; gap: 7px; flex-wrap: wrap; }
  .es-segbtn { display: inline-flex; align-items: center; gap: 7px; font-family: inherit; font-size: 12px; cursor: pointer; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink-soft); border-radius: 9px; padding: 8px 11px; }
  .es-segbtn.is-on { font-weight: 800; color: var(--ink); border-color: var(--ink); background: #f0e6d3; }
