  .es-segbtn.is-on.answer { border-color: #2E7D3E; background: #EAF6EC; color: #2E7D3E; }
  .es-segbtn.is-on.action { border-color: #9A6A12; background: #FBF1DA; color: #9A6A12; }
  .es-segbtn.is-on.escalate { border-color: #B5462E; background: #FBE7E0; color: #B5462E; }
  .es-char { font-size: 10.5px; color: var(--ink-faint); text-align: right; margin: -12px 0 18px; }
  .es-note { font-size: 12.5px; color: var(--ink-soft); background: var(--paper); border: 1.5px solid var(--line-soft, #efe8da); border-left: 3px solid var(--bean); border-radius: 9px; padding: 11px 13px; margin-bottom: 18px; line-height: 1.5; }
  .es-foot { display: flex; align-items: center; gap: 9px; padding: 15px 22px 20px; position: sticky; bottom: 0; background: var(--cream-2); border-top: 1px solid var(--line-soft, #efe8da); margin-top: 12px; }
  .es-btn { font-family: inherit; font-size: 12.5px; cursor: pointer; border-radius: 10px; padding: 10px 15px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 700; }
  .es-btn:hover { background: var(--cream-2); }
  .es-del { color: #B5462E; border-color: #f1c3b4; background: #fbe7e0; }
  .es-save { background: var(--bean); color: #f5eedf; border-color: var(--bean); }
  .es-grow { flex: 1; }
  .mv-card { width: 460px; max-width: 100%; max-height: 80vh; overflow: auto; background: var(--cream-2); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px -28px rgba(58, 40, 20, .55); padding: 20px 22px; margin: auto; }
  .mv-h { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .mv-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; line-height: 1.5; }
  .mv-target { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; font-family: inherit; font-size: 13px; padding: 11px 12px; border-radius: 11px; cursor: pointer; border: 1.5px solid var(--line); background: var(--paper); margin-bottom: 7px; }
  .mv-target:hover { border-color: #e4d3b4; background: #f0e6d3; }
  .mv-i { color: var(--ink-faint); width: 12px; text-align: center; flex: none; }
  @media (min-width: 720px) { .es-scrim { align-items: center; padding: 24px; } .es-sheet { border-radius: 18px; } }

  /* ---------- Responsive ---------- */
  /* Laptop-narrow: the draft view keeps only the essential actions in the bar; Snooze moves into ⋯. */
  @media (max-width: 1100px) {
    .dv-opt { display: none; }
    .dv-menu-narrow { display: block; }
    .draft-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; }
  }
  @media (max-width: 760px) {
    .app-shell { padding: 0 14px 80px; }
    /* Phone: one column, the draft before the email, and the actions docked at the bottom edge so
       the send is always under a thumb. The bar drops its backdrop blur here on purpose: a filter
       makes an element the containing block of its `position: fixed` children, which would pin the
       dock to the bar instead of to the screen. */
    .app-shell.is-draft { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    /* The nav wraps to four rows at phone width — a fifth of the screen above the email she opened.
       "← Inbox" is the way out of this view, so the topbar steps aside here. */
    .app-shell.is-draft .topbar { display: none; }
    .dv-bar { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--cream); margin-bottom: 12px; }
    .dv-bar-in { flex-wrap: wrap; gap: 4px 10px; padding: 6px 0 10px; }
    .dv-title { order: 3; flex-basis: 100%; }
    .dv-title h2 { white-space: normal; font-size: 16px; }
    .dv-bar .conf-badge { margin-left: auto; }
    .dv-acts {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; gap: 8px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(244,238,225,.97); border-top: 1.5px solid var(--line);
    }
    .dv-acts > .dv-btn { flex: 1; padding: 12px 8px; font-size: 14px; }
    .dv-acts > .dv-btn.is-primary { flex: 2; }
    .dv-acts .dv-more-btn { padding: 12px 8px; font-size: 14px; }
    .dv-menu { top: auto; bottom: calc(100% + 8px); }
    .app-shell.is-draft .bean-toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
    body:has(.app-shell.is-draft) .bean-chat-root { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
    .draft-grid { grid-template-columns: 1fr; gap: 12px; }
    .bean-panel { order: -1; }
    .mail-card { padding: 14px 16px; }
    .mail-body { font-size: 15px; }
    .mail-body.is-clamped { max-height: 6.4em; overflow: hidden; }
    .mail-body.is-clamped + .mail-more { display: inline-block; }
    .draft-box-head { padding-left: 16px; }
    .draft-text, .draft-edit { padding: 6px 16px 16px; font-size: 15px; }
    .greet-card { grid-template-columns: 1fr; text-align: left; }
    .greet-bean { justify-self: start; }
    .greet-text p { max-width: none; }
    .row-snippet { display: none; }
    .wordmark { font-size: 22px; }
    .admin-shell { grid-template-columns: 1fr; }
    .admin-nav { position: static; flex-direction: row; flex-wrap: wrap; }
    .admin-nav-title { width: 100%; }
  }
  @media (max-width: 420px) {
    .group-blurb { display: none; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React vendored locally (production builds) — no third-party CDN in the boot path, so an
       unpkg hiccup can't blank the app. The .jsx files are plain React.createElement (no JSX
       syntax), so they run as ordinary scripts; Babel was dead weight and is gone. -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>

  <script src="bean-pixel.jsx"></script>
  <script src="bean-data.jsx"></script>
  <script src="bean-ui.jsx"></script>
  <script src="bean-email.jsx"></script>
  <script src="bean-inbox.jsx"></script>
  <!-- before bean-draft: the draft card's citation chips read their kind→label map from
       window.beanCite, so the chip and the sheet it opens can never disagree. -->
  <script src="bean-cite.jsx"></script>
  <script src="bean-draft.jsx"></script>
  <script src="bean-admin.jsx"></script>
  <script src="bean-notebook.jsx"></script>
  <script src="bean-proposal.jsx"></script>
  <script src="bean-questionnaire.jsx"></script>
  <!-- The thinking mark. Only adds classes (all motion is the `Bean roast` keyframe block above),
       so it has no load-order constraint of its own beyond preceding bean-root. -->
  <script src="bean-roast.jsx"></script>
  <!-- after bean-proposal + bean-roast: a chat turn resolves into a ProposalCard, and its thinking
       row is the roasting mark. Both are read at render time via window, so this only has to
       precede bean-root. -->
  <script src="bean-chat.jsx"></script>
  <!-- after bean-ui: the stats charts colour the confidence mix from the same CONF map the
       badges use, so the report and the inbox can't disagree about what green looks like. -->
  <script src="bean-stats.jsx"></script>
  <!-- The public demo's guided tour. Reads window.PlayfulMark at render time and finds its targets
       by querySelector after the inbox has painted, so it only has to precede bean-root. Inert on
       every real tenant: bean-root mounts it solely when BEAN_DEMO_TENANT is set. -->
  <script src="bean-tour.jsx"></script>
  <script src="bean-root.jsx"></script>
</body>
</html>
