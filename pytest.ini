[pytest]
# No test is ever skipped by typing a flag.
#
# Three test files call the real Anthropic API: they cost tokens, need ANTHROPIC_API_KEY, and are
# nondeterministic. Before this file existed they were excluded by a habitual
# `--ignore=tests/test_calibration.py ...` on the command line — which meant the one suite that
# grades the agent was excluded by *muscle memory*, not by a decision, and nobody had to notice.
#
# So the exclusion lives here instead, and it has a name. `pytest` runs the free offline gate;
# `make eval` runs the graded suite on purpose. An exclusion nobody types is an exclusion nobody
# forgets to type back.
addopts = -m "not live"
markers =
    live: calls the real Anthropic API (costs tokens, needs ANTHROPIC_API_KEY). Run with `make eval`.
testpaths = tests
norecursedirs = tests/js/node_modules
